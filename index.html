<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Notes</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <script>
    // The disguise follows the phone: Samsung Notes on Android, iPhone Notes elsewhere. ?skin=samsung or
    // ?skin=ios forces one (remembered on this browser), e.g. to preview the Android look on an iPhone.
    (function () {
      var skin = new URLSearchParams(location.search).get('skin');
      try {
        if (skin === 'samsung' || skin === 'ios') localStorage.setItem('foldwise.skin', skin);
        skin = localStorage.getItem('foldwise.skin');
      } catch (e) { /* no storage: detect every time */ }
      if (skin !== 'samsung' && skin !== 'ios') skin = /Android/i.test(navigator.userAgent) ? 'samsung' : 'ios';
      document.documentElement.classList.add('skin-' + skin);
      document.write('<link rel="manifest" href="' + (skin === 'samsung' ? 'manifest-samsung.webmanifest' : 'manifest.webmanifest') + '">');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Folder view -->
  <section id="list-screen" class="screen active">
    <header class="list-nav">
      <button class="nav-icon samsung-only" type="button" tabindex="-1" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <span class="nav-right samsung-only">
        <button class="nav-icon" type="button" tabindex="-1" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 4.5 4.5" /></svg>
        </button>
        <button class="nav-icon" type="button" tabindex="-1" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.6" class="fill" /><circle cx="12" cy="12" r="1.6" class="fill" /><circle cx="12" cy="18.5" r="1.6" class="fill" /></svg>
        </button>
      </span>
      <button class="nav-back ios-only" type="button" tabindex="-1">
        <svg viewBox="0 0 12 20" class="chevron"><path d="M10 2 2 10l8 8" /></svg><span data-i18n="folders">Folders</span>
      </button>
      <button class="nav-icon ios-only" type="button" tabindex="-1" aria-label="More">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" /><circle cx="9" cy="14" r="1.4" class="fill" /><circle cx="14" cy="14" r="1.4" class="fill" /><circle cx="19" cy="14" r="1.4" class="fill" /></svg>
      </button>
    </header>
    <div class="scroll">
      <h1 id="folder-title" class="large-title" data-i18n="notes">Notes</h1>
      <p id="samsung-count" class="samsung-count samsung-only"></p>
      <div class="search ios-only">
        <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6" /><path d="m13 13 5 5" /></svg>
        <span data-i18n="search">Search</span>
        <svg viewBox="0 0 20 20" class="mic"><rect x="7" y="2" width="6" height="11" rx="3" /><path d="M4 10a6 6 0 0 0 12 0M10 16v3" /></svg>
      </div>
      <div id="note-groups"></div>
    </div>
    <button class="fab samsung-only" type="button" tabindex="-1" aria-label="New note">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="m13.5 6.5 4 4" /></svg>
    </button>
    <footer class="toolbar list-toolbar ios-only">
      <span></span>
      <span id="note-count" class="count"></span>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="New note">
        <svg viewBox="0 0 28 28"><path d="M22 14.5V22a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h7.5" /><path d="M21 3.5 24.5 7 14 17.5l-4.5 1 1-4.5z" /></svg>
      </button>
    </footer>
  </section>

  <!-- Dims the folder view while a note slides over it -->
  <div id="shade" class="shade"></div>

  <!-- Single note -->
  <section id="note-screen" class="screen">
    <header class="note-nav">
      <button id="back" class="nav-back" type="button">
        <svg viewBox="0 0 12 20" class="chevron"><path d="M10 2 2 10l8 8" /></svg><span class="ios-only" data-i18n="notes">Notes</span>
      </button>
      <div class="nav-right samsung-only">
        <button class="nav-icon" type="button" tabindex="-1" aria-label="Edit">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="m13.5 6.5 4 4" /></svg>
        </button>
        <button class="nav-icon" type="button" tabindex="-1" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.6" class="fill" /><circle cx="12" cy="12" r="1.6" class="fill" /><circle cx="12" cy="18.5" r="1.6" class="fill" /></svg>
        </button>
      </div>
      <div class="nav-right ios-only">
        <button class="nav-icon" type="button" tabindex="-1" aria-label="Share">
          <svg viewBox="0 0 28 28"><path d="M9.5 11H7a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 7 25h14a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 21 11h-2.5M14 17V3M9.5 7.5 14 3l4.5 4.5" /></svg>
        </button>
        <button class="nav-icon" type="button" tabindex="-1" aria-label="More">
          <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" /><circle cx="9" cy="14" r="1.4" class="fill" /><circle cx="14" cy="14" r="1.4" class="fill" /><circle cx="19" cy="14" r="1.4" class="fill" /></svg>
        </button>
      </div>
    </header>
    <div id="note-scroll" class="scroll note-scroll">
      <p id="note-date" class="note-date"></p>
      <article id="note-body" class="note-body"></article>
      <!-- Room below the list so there is always somewhere to tap -->
      <div class="tap-zone"></div>
    </div>
    <footer class="toolbar note-toolbar ios-only">
      <button class="nav-icon" type="button" tabindex="-1" aria-label="Checklist">
        <svg viewBox="0 0 28 28"><circle cx="6" cy="8" r="2.5" /><circle cx="6" cy="20" r="2.5" /><path d="M12 8h12M12 20h12" /></svg>
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="Attach">
        <svg viewBox="0 0 28 28"><path d="M20.5 13 13 20.5a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7L11 18a1.6 1.6 0 0 1-2.3-2.3l7-7" /></svg>
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="Markup">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" /><path d="m10 18.5 1-3.5 6-6 2.5 2.5-6 6z" /></svg>
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="New note">
        <svg viewBox="0 0 28 28"><path d="M22 14.5V22a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h7.5" /><path d="M21 3.5 24.5 7 14 17.5l-4.5 1 1-4.5z" /></svg>
      </button>
    </footer>
    <form id="secret-form" class="secret-form" autocomplete="off" novalidate>
      <input id="secret" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-hidden="true">
    </form>
  </section>

  <!-- Hidden setup sheet: long-press the "Notes" title. Pages are built by js/setup.js -->
  <section id="settings-screen" class="screen">
    <div id="setup-stack" class="setup-stack"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
